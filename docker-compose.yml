# =============================================================================
#  DOCKER COMPOSE - guide rapide
# =============================================================================
#  Docker en 30 secondes :
#    - une IMAGE   = une recette figée (ex : "nginx", "mysql")
#    - un CONTENEUR = une image en train de tourner
#    - un SERVICE  = une entrée ci-dessous ; compose crée le(s) conteneur(s)
#    - un VOLUME   = un disque qui survit à la suppression du conteneur
#                    (indispensable pour la base de données !)
#    - un RÉSEAU   = compose en crée un : les services s'y appellent par leur
#                    NOM (le back joint la base avec l'hôte "db", pas "localhost")
#
#  Commandes utiles (à lancer à la racine du repo) :
#    docker compose up -d --build                  front seul (état actuel)
#    docker compose --profile backend up -d --build   front + back + base de données
#    docker compose ps                             état des services
#    docker compose logs -f backend                   logs en direct d'un service
#    docker compose restart backend                   redémarrer un service
#    docker compose down                           tout arrêter (données conservées)
#    docker compose down -v                        tout arrêter ET EFFACER la base !
#
#  Les variables ${...} viennent du fichier `.env` à la racine (voir .env.example).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FRONT : Angular compilé, servi par nginx. Actif par défaut.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend              # dossier contenant le Dockerfile
      args:
        FRONT_API_URL: ${FRONT_API_URL:-/api}
    env_file:
      - .env
    environment:
      # Où nginx envoie /api : BACK_URL du .env (ex. back d'équipe http://64.176.83.254:3000), sinon le service backend ci-dessous.
      BACK_URL: ${BACK_URL:-http://backend:${BACK_PORT:-3000}}
    ports:
      - "${FRONT_PORT:-8080}:80"    # "port sur ta machine : port dans le conteneur"
    restart: unless-stopped         # redémarre tout seul après un crash/reboot du serveur

  # ---------------------------------------------------------------------------
  # BACK : à activer quand la techno sera choisie.
  # `profiles` = service ignoré tant qu'on ne lance pas avec `--profile backend`.
  # Pour l'activer pour de bon : supprimer les 2 lignes `profiles`.
  # ---------------------------------------------------------------------------
  backend:
    profiles: ["backend"]
    build:
      context: .                       # racine du dépôt : l'API lit aussi data/ (mapping de synonymes et codes EPPO)
      dockerfile: backend/Dockerfile
    env_file:
      - .env                        # injecte TOUTES les variables du .env racine dans le conteneur
    ports:
      - "${BACK_HOST_PORT:-3000}:${BACK_PORT:-3000}"   # accès direct pour tester (optionnel)
    # Pas de depends_on : la base est le PostgreSQL de l'équipe (DATABASE_URL du .env), pas un conteneur ici.
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # DB : MySQL. Même principe de profil que le back.
  # Pas de `ports` : seuls les autres conteneurs y accèdent (plus sûr en prod).
  # Pour s'y connecter depuis ta machine, ajouter : ports: ["3306:3306"]
  # ---------------------------------------------------------------------------
  # Ancien MySQL du starter kit, NON utilisé par le projet (PostgreSQL d'équipe) : profil "mysql", donc jamais lancé par défaut.
  db:
    profiles: ["mysql"]
    image: mysql:8.4
    env_file:
      - .env                        # l'image MySQL lit MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    volumes:
      - db_data:/var/lib/mysql      # données persistantes (voir `volumes` en bas)
    healthcheck:                    # compose sait ainsi quand la base est prête
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
